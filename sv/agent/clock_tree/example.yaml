# clock_tree 配置示范
# 字段与 models.py、nodes.py 一致；渲染模板时载入本文件即可校验。

setting_defs:
  - name: pll_sel
    type: int
    default: 0
  - name: run_tree_check
    type: bit
    default: true

trees:
  - name: main
    settings:
      pll_sel: 0
      run_tree_check: 1
    nodes:
      - name: xtal
        kind: source
        path: dut.xtal
        targets:
          - pll_main

      - name: pll_main
        kind: pll
        path: dut.pll_main_out
        targets:
          - gate0
          - div0

      - name: gate0
        kind: gate
        source: w_pll_main_gate0
        target: w_gate0_div0

      - name: div0
        kind: div
        source: w_gate0_div0
        target: w_div0_inv0

      - name: inv0
        kind: inv
        source: w_div0_inv0
        target: w_inv0_dto0

      - name: dto0
        kind: dto
        source: w_inv0_dto0
        target: w_dto0_clk_sys

      - name: clk_sys
        kind: clk
        freq: 100
        path: dut.clk_sys
        source: w_dto0_clk_sys

      - name: mux2
        kind: mux
        source:
          "0": pll_main
          "1": xtal
        target: w_mux2_out

vars:
  dut_prefix: dut.

min_freq_hz: 500
duty_min: 0.50
duty_max: 0.66
