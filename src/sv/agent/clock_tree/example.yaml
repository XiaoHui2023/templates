# clock_tree 全功能示范：各 kind、三种 pll_kind、clk path 与 reg/regs、test_route 条件均覆盖
nodes:
    xtal:
      kind: source
      source_kind: source
      freq: 24000000

    pad_xtal:
      kind: source
      source_kind: pad
      freq: 24000000

    pll_tci:
      kind: pll
      source: xtal
      pll_kind: tci
      freq: 48000000
      regs:
        lock: blk_pll_tci.lock
        bypass: blk_pll_tci.bypass
        pwrdn: blk_pll_tci.pwrdn
        reset: blk_pll_tci.reset
        clkod: blk_pll_tci.clkod
        clkf: blk_pll_tci.clkf
        clkr: blk_pll_tci.clkr
        bwadj: blk_pll_tci.bwadj

    pll_sc:
      kind: pll
      source: xtal
      pll_kind: sc
      freq: 60000000
      regs:
        lock: blk_pll_sc.lock
        vocpd: blk_pll_sc.vocpd
        postdivpd: blk_pll_sc.postdivpd
        dsmpd: blk_pll_sc.dsmpd
        pd: blk_pll_sc.pd
        bypass: blk_pll_sc.bypass
        refdiv: blk_pll_sc.refdiv
        postdiv2: blk_pll_sc.postdiv2
        postdiv1: blk_pll_sc.postdiv1
        fbdiv: blk_pll_sc.fbdiv

    pll_dw:
      kind: pll
      source: xtal
      pll_kind: dw
      freq: 72000000
      regs:
        lock: blk_pll_dw.lock
        fbdiv: blk_pll_dw.fbdiv
        prediv: blk_pll_dw.prediv
        reset: blk_pll_dw.reset
        pwron: blk_pll_dw.pwron
        shift: blk_pll_dw.shift
        bypass: blk_pll_dw.bypass
        divvcor: blk_pll_dw.divvcor
        r: blk_pll_dw.r
        p: blk_pll_dw.p
        divvcop: blk_pll_dw.divvcop
        enr: blk_pll_dw.enr
        enp: blk_pll_dw.enp

    pll_inno:
      kind: pll
      source: xtal
      pll_kind: inno
      freq: 48000000
      regs:
        lock: blk_pll_inno.lock
        pd: blk_pll_inno.pd
        refdiv: blk_pll_inno.refdiv
        fbdiv: blk_pll_inno.fbdiv
        postdiv1[0]: blk_pll_inno.postdiv1_0
        postdiv2[0]: blk_pll_inno.postdiv2_0
        postdiv1[1]: blk_pll_inno.postdiv1_1
        postdiv2[1]: blk_pll_inno.postdiv2_1

    mux_pll:
      kind: mux
      source:
        "0": pll_inno[0]
        "1": pll_inno[1]
      reg: blk_mux_pll.sel

    mux_ref:
      kind: mux
      source:
        "0": mux_pll
        "1": xtal
      reg: blk_mux_ref.sel

    gate0:
      kind: gate
      source: mux_ref
      reg: blk_gate0.en

    cell_buf:
      kind: cell
      cell_kind: buf
      path: dut.clk_buf
      source: gate0

    cell_freq:
      kind: cell
      cell_kind: buf
      path: dut.cell_freq
      source: xtal
      freq: 24000000

    gate_cell_off:
      kind: gate
      source: xtal
      open: 0

    cell_disabled:
      kind: cell
      cell_kind: buf
      path: dut.cell_disabled
      source: gate_cell_off
      active: false

    div_r_0:
      kind: div_r
      ratio: 99
      source: cell_buf

    div0:
      kind: div
      div_kind: div
      source: div_r_0
      regs:
        rst: blk_div0.rst
        load: blk_div0.load
        div: blk_div0.div

    inv0:
      kind: inv
      inv_kind: inv
      source: div0

    dto0:
      kind: div
      div_kind: dto
      source: inv0
      regs:
        rst: blk_dto0.rst
        load: blk_dto0.load
        bypass: blk_dto0.bypass
        step: blk_dto0.step

    clk_out:
      kind: clk
      stable: true
      freq: 100000000
      path: dut.clk_out
      source: dto0

    clk_aux:
      kind: clk
      path: dut.clk_aux
      source: gate0

    clk_volatile:
      kind: clk
      volatile: true
      path: dut.clk_volatile
      freq: 50000000
      source: gate0

    clk_disabled:
      kind: clk
      active: false
      path: dut.clk_disabled
      source: gate0

    mux_wide:
      kind: mux
      source:
        "0": pll_tci
        "1": pll_sc
        "2": pll_dw
        "3": pll_inno[1]
      reg: blk_mux_wide.sel[1:0]

    mux_fixed:
      kind: mux
      sel: 2
      source:
        "0": mux_ref
        "1": mux_wide
        "2": pad_xtal
      reg: blk_mux_fixed.sel[1:0]

    gate_fixed:
      kind: gate
      open: 1
      source: mux_fixed
      reg: blk_gate_fixed.en

    div_fixed:
      kind: div
      div_kind: div_n
      ratio: 6
      source: gate_fixed
      regs:
        rst: blk_div_fixed.ctrl[0]
        load: blk_div_fixed.ctrl[1]
        div: blk_div_fixed.div[7:0]

    dto_rand:
      kind: div
      div_kind: dto_n
      source: div_fixed
      regs:
        rst: blk_dto_rand.ctrl[0]
        load: blk_dto_rand.ctrl[1]
        bypass: blk_dto_rand.ctrl[2]
        step: blk_dto_rand.step[15:0]

    inv_mux0:
      kind: inv
      inv_kind: inv_mux
      source: dto_rand
      reg: blk_inv_mux0.sel

    clk_wide_a:
      kind: clk
      path: dut.clk_wide_a
      source: inv_mux0

    clk_wide_b:
      kind: clk
      stable: true
      freq: 12000000
      path: dut.clk_wide_b
      source: div_fixed

    clk_wide_disabled:
      kind: clk
      active: false
      path: dut.clk_wide_disabled
      source: mux_wide

settings:
  direct_config: true
  class_regmodel: regmodel_t
  min_freq_hz: 15000
  div_freq_tolerance: 0.01
  duty_min: 48
  duty_max: 67
