# clock_tree 全功能示范：各 kind、三种 pll_kind、path 与 reg/regs、test_route 条件均覆盖

trees:
  - name: main
    module_path: dut
    nodes:
      xtal:
        kind: source
        source_kind: source
        path: dut.xtal
        freq: 24000000

      pad_xtal:
        kind: source
        source_kind: pad
        path: dut.pad_xtal
        freq: 24000000

      pll_tci:
        kind: pll
        source: xtal
        pll_kind: tci
        path: dut.pll_tci
        freq: 48000000
        regs:
          lock: blk_pll_tci.lock
          bypass: blk_pll_tci.bypass
          pwrdn: blk_pll_tci.pwrdn
          reset: blk_pll_tci.reset
          clkod: blk_pll_tci.clkod
          clkf: blk_pll_tci.clkf
          clkr: blk_pll_tci.clkr
          bwadj: blk_pll_tci.bwadj

      pll_sc:
        kind: pll
        source: xtal
        pll_kind: sc
        path: dut.pll_sc
        freq: 60000000
        regs:
          lock: blk_pll_sc.lock
          vocpd: blk_pll_sc.vocpd
          postdivpd: blk_pll_sc.postdivpd
          dsmpd: blk_pll_sc.dsmpd
          pd: blk_pll_sc.pd
          bypass: blk_pll_sc.bypass
          refdiv: blk_pll_sc.refdiv
          postdiv2: blk_pll_sc.postdiv2
          postdiv1: blk_pll_sc.postdiv1
          fbdiv: blk_pll_sc.fbdiv

      pll_dw:
        kind: pll
        source: xtal
        pll_kind: dw
        path: dut.pll_dw
        freq: 72000000
        regs:
          lock: blk_pll_dw.lock
          fbdiv: blk_pll_dw.fbdiv
          prediv: blk_pll_dw.prediv
          reset: blk_pll_dw.reset
          pwron: blk_pll_dw.pwron
          shift: blk_pll_dw.shift
          bypass: blk_pll_dw.bypass
          divvcor: blk_pll_dw.divvcor
          r: blk_pll_dw.r
          p: blk_pll_dw.p
          divvcop: blk_pll_dw.divvcop
          enr: blk_pll_dw.enr
          enp: blk_pll_dw.enp

      pll_inno:
        kind: pll
        source: xtal
        pll_kind: inno
        path: dut.pll_inno
        freq: 48000000
        regs:
          lock: blk_pll_inno.lock
          pd: blk_pll_inno.pd
          refdiv: blk_pll_inno.refdiv
          fbdiv: blk_pll_inno.fbdiv
          postdiv1[0]: blk_pll_inno.postdiv1_0
          postdiv2[0]: blk_pll_inno.postdiv2_0
          postdiv1[1]: blk_pll_inno.postdiv1_1
          postdiv2[1]: blk_pll_inno.postdiv2_1

      mux_pll:
        kind: mux
        path: dut.mux_pll
        source:
          "0": pll_inno[0]
          "1": pll_inno[1]
        reg: blk_mux_pll.sel

      mux_ref:
        kind: mux
        path: dut.mux_ref
        source:
          "0": mux_pll
          "1": xtal
        reg: blk_mux_ref.sel

      gate0:
        kind: gate
        source: mux_ref
        path: dut.gate0
        reg: blk_gate0.en

      cell_buf:
        kind: cell
        cell_kind: buf
        source: gate0
        path: dut.cell_buf

      div_r_0:
        kind: div_r
        ratio: 99
        source: cell_buf
        path: dut.div_r_0

      div0:
        kind: div
        div_kind: div
        source: div_r_0
        path: dut.div0
        regs:
          rst: blk_div0.rst
          load: blk_div0.load
          div: blk_div0.div

      inv0:
        kind: inv
        inv_kind: inv
        source: div0

      dto0:
        kind: div
        div_kind: dto
        source: inv0
        path: dut.dto0
        regs:
          rst: blk_dto0.rst
          load: blk_dto0.load
          bypass: blk_dto0.bypass
          step: blk_dto0.step

      clk_out:
        kind: clk
        freq: 100000000
        stable: true
        path: dut.clk_out
        source: dto0

      clk_aux:
        kind: clk
        path: dut.clk_aux
        source: gate0
        no_check: true

      clk_standalone:
        kind: clk
        path: dut.clk_standalone
        freq: 50000000

settings:
  class_regmodel: regmodel_t
  min_freq_hz: 15000
  duty_min: 50
  duty_max: 66
