# Canonical plugin-first input. Each present kind maps directly to one SV plugin class.
xtal:
  kind: source
  frequence: 24000000
  out_path: dut.xtal_clk

pll_sc0:
  kind: pll_sc
  source: xtal
  frequence: 1188000000
  in_path: dut.pll_sc_ref
  out_path: dut.pll_sc_clk
  regs:
    lock: blk_pll_sc.lock
    vocpd: blk_pll_sc.vocpd
    postdivpd: blk_pll_sc.postdivpd
    dsmpd: blk_pll_sc.dsmpd
    pd: blk_pll_sc.pd
    bypass: blk_pll_sc.bypass
    refdiv: blk_pll_sc.refdiv
    postdiv2: blk_pll_sc.postdiv2
    postdiv1: blk_pll_sc.postdiv1
    fbdiv: blk_pll_sc.fbdiv

gate0:
  kind: gate
  source: pll_sc0
  open: 1
  in_path: dut.gate0_i
  out_path: dut.gate0_o
  reg: blk_gate0.en

div0:
  kind: div_div
  source: gate0
  ratio: 3
  in_path: dut.div0_i
  out_path: dut.div0_o
  regs:
    rst: blk_div0.rst
    load: blk_div0.load
    div: blk_div0.value[7:0]

clk_cpu:
  kind: clk
  source: div0
  frequence: 396000000
  enabled: 1
  path: dut.clk_cpu

cell_cpu:
  kind: cell
  source: clk_cpu
  path: dut.cell_cpu

# Python retains arbitrary kinds. The compiler reports a missing plugin only
# when this node is made present.
future_extension:
  kind: vendor_extension
  present: false
  source: xtal
  calibration: 7

settings:
  class_regmodel: regmodel_t
  direct_config: true
  plugin:
    divider:
      freq_tolerance: 0.01
    inverter:
      settle_ns: 100
    div_div:
      settle_ns: 200
    div_dto:
      settle_ns: 200
