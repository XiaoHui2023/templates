nodes:
    osc:
      kind: source
      freq: 24000000
    pll_probe:
      kind: pll
      pll_kind: tci
      freq: 480000000
    clk_cpu:
      kind: clk
      path: dut.clk_cpu
      freq: 1000000000
    cell_cpu:
      kind: cell
      path: dut.cell_cpu
      source: clk_cpu
    clk_disabled:
      kind: clk
      path: dut.clk_disabled
      disable: true
    clk_volatile:
      kind: clk
      volatile: true
      path: dut.clk_volatile
      freq: 50000000
    clk_without_freq:
      kind: clk
      path: dut.clk_without_freq
settings:
  class_prefix: clk_tree_
  direct_check: true
