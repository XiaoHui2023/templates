xtal:
  kind: source
  frequence: 24000000
  out_path: dut.xtal_clk

pll_sc0:
  kind: pll_sc
  source: xtal
  frequence: 1188000000
  in_path: dut.pll_sc_ref
  out_path: dut.pll_sc_clk
  regs:
    lock: blk_pll_sc.lock
    vocpd: blk_pll_sc.vocpd
    postdivpd: blk_pll_sc.postdivpd
    dsmpd: blk_pll_sc.dsmpd
    pd: blk_pll_sc.pd
    bypass: blk_pll_sc.bypass
    refdiv: blk_pll_sc.refdiv
    postdiv2: blk_pll_sc.postdiv2
    postdiv1: blk_pll_sc.postdiv1
    fbdiv: blk_pll_sc.fbdiv

gate0:
  kind: gate
  source: pll_sc0
  open: 1
  in_path: dut.gate0_i
  out_path: dut.gate0_o
  reg: blk_gate0.en

div0:
  kind: div_div
  source: gate0
  ratio: 3
  in_path: dut.div0_i
  out_path: dut.div0_o
  regs:
    rst: blk_div0.rst
    load: blk_div0.load
    div: blk_div0.value[7:0]

clk_cpu:
  kind: clk
  source: div0
  frequence: 396000000
  enabled: 1
  path: dut.clk_cpu

cell_cpu:
  kind: cell
  source: clk_cpu
  path: dut.cell_cpu

clk_stable:
  kind: clk
  source: xtal
  path: dut.clk_stable
  stable: true

bus_div:
  kind: clk_div_with_clken
  source: pll_sc0
  in_path: dut.bus_div_i
  out_paths:
    clk_arm_core: dut.clk_arm_core
    hclk: dut.hclk
    hclken: dut.hclken
  regs:
    div: blk_bus_div.value[3:0]
    rst: blk_bus_div.rst
    load: blk_bus_div.load
  ratio: 3

bus_core:
  kind: clk
  source: bus_div[clk_arm_core]
  path: dut.bus_core

bus_hclk:
  kind: clk
  source: bus_div[hclk]
  path: dut.bus_hclk

bus_hclken:
  kind: clk
  source: bus_div[hclken]
  path: dut.bus_hclken
  check_duty: false

future_extension:
  kind: vendor_extension
  exclude: true
  source: xtal
  calibration: 7

div_shared:
  kind: div_div
  source: gate0
  in_path: dut.div_shared_i
  out_path: dut.div_shared_o
  regs:
    div: blk_div0.value[7:0]
    rst: blk_div_shared.rst
    load: blk_div_shared.load

clk_shared:
  kind: clk
  source: div_shared
  path: dut.clk_shared
  frequence: 396000000
  enabled: 1

dto0:
  kind: div_dto
  source: xtal
  in_path: dut.dto0_i
  out_path: dut.dto0_o
  ratio: 4
  regs:
    rst: blk_dto0.rst
    load: blk_dto0.load
    step: blk_dto0.step
    bypass: blk_dto0.bypass

clk_dto:
  kind: clk
  source: dto0
  path: dut.clk_dto
  frequence: 6000000

mux_sparse:
  kind: mux
  source:
    "2": xtal
    "5": pll_sc0
  in_paths:
    "2": dut.mux_sparse_xtal
    "5": dut.mux_sparse_pll
  out_path: dut.mux_sparse_o
  reg: blk_mux_sparse.sel

clk_mux:
  kind: clk
  source: mux_sparse
  path: dut.clk_mux
  frequence: 1188000000
