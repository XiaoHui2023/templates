class_regmodel: pad_regmodel
drive_strength_width: &drive_strength_width 3
pad0_drive_strength_reg: &pad0_drive_strength_reg pad0_ctrl.drive_strength[2:0]
extra_signals:
  - name: output
  - name: drive_strength
    width: *drive_strength_width
pads:
  gpio0:
    pad_value:
      path: dut.pad0
    pull_up:
      reg: pad0_ctrl.pull_up
      path: dut.pad0_pull_up
    pull_down:
      reg: pad0_ctrl.pull_down
      path: dut.pad0_pull_down
    output:
      reg: pad0_ctrl.output
      path: dut.pad0_output
    drive_strength:
      reg: *pad0_drive_strength_reg
      path: dut.pad0_drive_strength
  gpio1:
    pad_value:
      path: dut.pad1
    pull_up:
      fix: 1
      path: dut.pad1_pull_up
    pull_down:
      reg: pad1_ctrl.pull_down
      path: dut.pad1_pull_down
    output:
      fix: 0
      path: dut.pad1_output
    drive_strength:
      present: false
