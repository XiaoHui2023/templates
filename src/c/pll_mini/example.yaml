# pll_mini 示范：单路 PLL SC + div + mux + gate，频率与 clock_tree 同形

ralf: example.ralf

tree:
  name: main
  nodes:
    xtal:
      kind: source
      freq: 24000000

    pll_sc:
      kind: pll
      source: xtal
      pll_kind: sc
      freq: 60000000
      regs:
        lock: blk_pll_sc.stat.lock
        vocpd: blk_pll_sc.pd.vocpd
        postdivpd: blk_pll_sc.pd.postdivpd
        dsmpd: blk_pll_sc.pd.dsmpd
        pd: blk_pll_sc.pd.pd
        bypass: blk_pll_sc.pd.bypass
        refdiv: blk_pll_sc.div.refdiv
        postdiv2: blk_pll_sc.div.postdiv2
        postdiv1: blk_pll_sc.div.postdiv1
        fbdiv: blk_pll_sc.div.fbdiv

    div0:
      kind: div
      div_kind: div
      source: pll_sc
      regs:
        rst: blk_div0.ctrl.rst
        load: blk_div0.ctrl.load
        div: blk_div0.ctrl.div

    cpu_gate0:
      kind: div
      div_kind: cpu_gate
      source: div0
      regs:
        rst: blk_cpu_gate0.ctrl.rst
        div: blk_cpu_gate0.ctrl.div

    mux_ref:
      kind: mux
      source:
        "0": div0
        "1": xtal
      reg: blk_mux_ref.sel.sel

    div_mux:
      kind: div
      div_kind: div
      source: mux_ref
      regs:
        rst: blk_div_mux.ctrl.rst
        load: blk_div_mux.ctrl.load
        div: blk_div_mux.ctrl.div

    gate0:
      kind: gate
      source: mux_ref
      reg: blk_gate0.en.en

    clk_aux:
      kind: clk
      source: div_mux

    clk_out:
      kind: clk
      source: gate0
      freq: 30000000

    clk_hclk:
      kind: clk
      source:
        name: cpu_gate0
        out_group: hclk
      freq: 15000000

    src_27m:
      kind: source
      freq: 27000000

    src_1188m:
      kind: source
      freq: 1188000000

    div_1188:
      kind: div
      div_kind: div
      source: src_1188m
      regs:
        rst: blk_div_1188.ctrl.rst
        load: blk_div_1188.ctrl.load
        div: blk_div_1188.ctrl.div

    mux_clk:
      kind: mux
      source:
        "0": src_27m
        "1": div_1188
      reg: blk_mux_clk.sel.sel

    div_r2:
      kind: div
      div_kind: div_r
      source: mux_clk
      ratio: 2

    clk_13m5:
      kind: clk
      source: div_r2
      freq: 13500000

settings:
  main_fn: chip_pll_config
  gate_reg_high_means_open: true
