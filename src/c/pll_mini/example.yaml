# pll_mini 全器件示范：各 source / pll / div / inv / mux / gate / cell / clk。
# 晶振经 mux_ref_src → div_ref(div_r 1) → mux_ref_mid → inv_ref → mux_ref_tail → gate_ref 后再馈入各 PLL；
# MHz 区为交错 PLL 枢纽与独立高频岛；dto / dto_n 在低频频段单独成岛以便求解。
#
# 性能压力岛：故意制造求解慢路径，与 templates-jinja-build-test 一并回归。
# 主参考路径 div_ref 用 div_r ratio 1 锁定 24 MHz 量级参考，避免与 pll_sc 60 MHz 等枢纽 PLL 合并后 ref 过低无解。
#
#   ref_dto    — 压力岛 mux_stress_ref → dto_stress_ref → div_stress_ref → pll_stress_sc；
#                另支 dto_n_stress_ref → pll_stress_tci；inno 岛 dto_stress_inno → pll_stress_inno
#   ref_mux    — 枢纽 mux_ref_mid 四路 × mux_ref_tail 三路叠在 gate_ref 前，放大 inno 内层 ref_mux_iters；
#                mux_stress_ref 三路、mux_stress_inno_ref 四路；inno 岛 mux_stress_inno_a/b 双路输出 mux
#   mux_combo  — mux_ms0×mux_ms1×mux_ms2×mux_ms3，四×四×三×四 = 192 路组合枚举
#   deep_div   — gate_deep 后六路并行自由 div 与 clk，合并为单一子树
#   div_share  — clk_share_a / b / c 共用 div_share，合并子树后共用一组 ratio

ralf: example.ralf

tree:
  name: main
  nodes:
    xtal:
      kind: source
      source_kind: source
      freq: 24000000

    pad_xtal:
      kind: source
      source_kind: pad
      freq: 24000000

    vdd0:
      kind: source
      source_kind: vdd

    gnd0:
      kind: source
      source_kind: gnd

    mux_ref_src:
      kind: mux
      source:
        "0": xtal
        "1": pad_xtal
      reg: blk_mux_ref_src.sel.sel

    div_ref:
      kind: div
      div_kind: div_r
      source: mux_ref_src
      ratio: 1

    mux_ref_mid:
      kind: mux
      source:
        "0": div_ref
        "1": xtal
        "2": pad_xtal
        "3": src_27m
      reg: blk_mux_ref_mid.sel.sel

    inv_ref:
      kind: inv
      inv_kind: inv
      source: mux_ref_mid

    mux_ref_tail:
      kind: mux
      source:
        "0": inv_ref
        "1": xtal
        "2": pad_xtal
      reg: blk_mux_ref_tail.sel.sel

    gate_ref:
      kind: gate
      source: mux_ref_tail
      reg: blk_gate_ref.en.en

    pll_tci:
      kind: pll
      source: gate_ref
      pll_kind: tci
      freq: 48000000
      regs:
        lock: blk_pll_tci.lock.lock
        bypass: blk_pll_tci.bypass.bypass
        pwrdn: blk_pll_tci.pwrdn.pwrdn
        reset: blk_pll_tci.reset.reset
        clkod: blk_pll_tci.clkod.clkod
        clkf: blk_pll_tci.clkf.clkf
        clkr: blk_pll_tci.clkr.clkr
        bwadj: blk_pll_tci.bwadj.bwadj

    pll_sc:
      kind: pll
      source: gate_ref
      pll_kind: sc
      freq: 60000000
      regs:
        lock: blk_pll_sc.stat.lock
        vocpd: blk_pll_sc.pd.vocpd
        postdivpd: blk_pll_sc.pd.postdivpd
        dsmpd: blk_pll_sc.pd.dsmpd
        pd: blk_pll_sc.pd.pd
        bypass: blk_pll_sc.pd.bypass
        refdiv: blk_pll_sc.div.refdiv
        postdiv2: blk_pll_sc.div.postdiv2
        postdiv1: blk_pll_sc.div.postdiv1
        fbdiv: blk_pll_sc.div.fbdiv

    pll_dw:
      kind: pll
      source: gate_ref
      pll_kind: dw
      freq: 96000000
      regs:
        lock: blk_pll_dw.lock.lock
        fbdiv: blk_pll_dw.fbdiv.fbdiv
        prediv: blk_pll_dw.prediv.prediv
        reset: blk_pll_dw.reset.reset
        pwron: blk_pll_dw.pwron.pwron
        shift: blk_pll_dw.shift.shift
        bypass: blk_pll_dw.bypass.bypass
        divvcor: blk_pll_dw.divvcor.divvcor
        r: blk_pll_dw.r.r
        p: blk_pll_dw.p.p
        divvcop: blk_pll_dw.divvcop.divvcop
        enr: blk_pll_dw.enr.enr
        enp: blk_pll_dw.enp.enp

    pll_inno:
      kind: pll
      source: gate_ref
      pll_kind: inno
      regs:
        lock: blk_pll_inno.lock.lock
        pd: blk_pll_inno.pd.pd
        refdiv: blk_pll_inno.refdiv.refdiv
        fbdiv: blk_pll_inno.fbdiv.fbdiv
        postdiv1[0]: blk_pll_inno.postdiv1_0.postdiv1_0
        postdiv2[0]: blk_pll_inno.postdiv2_0.postdiv2_0
        postdiv1[1]: blk_pll_inno.postdiv1_1.postdiv1_1
        postdiv2[1]: blk_pll_inno.postdiv2_1.postdiv2_1

    mux_pll_hub:
      kind: mux
      source:
        "0": pll_tci
        "1": pll_sc
      reg: blk_mux_pll_hub.sel.sel

    div0:
      kind: div
      div_kind: div
      source: pll_sc
      regs:
        rst: blk_div0.ctrl.rst
        load: blk_div0.ctrl.load
        div: blk_div0.ctrl.div

    div_n0:
      kind: div
      div_kind: div_n
      source: mux_pll_hub
      regs:
        rst: blk_div_n0.ctrl.rst
        load: blk_div_n0.ctrl.load
        div: blk_div_n0.ctrl.div

    div_tci:
      kind: div
      div_kind: div
      source: mux_pll_hub
      regs:
        rst: blk_div_tci.ctrl.rst
        load: blk_div_tci.ctrl.load
        div: blk_div_tci.ctrl.div

    dto0:
      kind: div
      div_kind: dto
      source: src_dto_in
      regs:
        rst: blk_dto0.ctrl.rst
        load: blk_dto0.ctrl.load
        bypass: blk_dto0.ctrl.bypass
        step: blk_dto0.ctrl.step

    dto_n0:
      kind: div
      div_kind: dto_n
      source: src_dto_n_in
      regs:
        rst: blk_dto_n0.ctrl.rst
        load: blk_dto_n0.ctrl.load
        bypass: blk_dto_n0.ctrl.bypass
        step: blk_dto_n0.ctrl.step

    cpu_gate0:
      kind: div
      div_kind: cpu_gate
      source: div0
      regs:
        rst: blk_cpu_gate0.ctrl.rst
        div: blk_cpu_gate0.ctrl.div

    mux_ref:
      kind: mux
      source:
        "0": div0
        "1": xtal
      reg: blk_mux_ref.sel.sel

    mux_inno:
      kind: mux
      source:
        "0": pll_inno[0]
        "1": pll_inno[1]
      reg: blk_mux_inno.sel.sel

    gate0:
      kind: gate
      source: mux_ref
      reg: blk_gate0.en.en

    gate_dw:
      kind: gate
      source: pll_dw
      reg: blk_gate_dw.en.en

    gate_inno:
      kind: gate
      source: cell_buf
      reg: blk_gate_inno.en.en

    gate_pad:
      kind: gate
      source: mux_ref_src
      reg: blk_gate_pad.en.en

    div_r_dw:
      kind: div
      div_kind: div_r
      source: gate_dw
      ratio: 2

    cell_buf:
      kind: cell
      cell_kind: buf
      source: mux_inno

    inv0:
      kind: inv
      inv_kind: inv
      source: div_tci

    inv_mux:
      kind: inv
      inv_kind: inv_mux
      source: div_n0

    inv_cell:
      kind: inv
      inv_kind: inv_cell
      source: div_r_dw

    mux_idle:
      kind: mux
      source:
        "0": gate_pad
        "1": vdd0
        "2": gnd0
      reg: blk_mux_idle.sel.sel

    clk_out:
      kind: clk
      source: gate0
      freq: 30000000
      always_active: true

    clk_hclk:
      kind: clk
      source:
        name: cpu_gate0
        out_group: hclk
      freq: 15000000

    clk_arm:
      kind: clk
      source:
        name: cpu_gate0
        out_group: clk_arm_core
      freq: 30000000

    clk_tci:
      kind: clk
      source: div_tci
      freq: 24000000

    clk_dto:
      kind: clk
      source: dto0
      freq: 6000

    clk_dto_n:
      kind: clk
      source: dto_n0
      freq: 4000

    clk_dw:
      kind: clk
      source: inv_cell
      freq: 48000000

    clk_inno:
      kind: clk
      source: gate_inno
      freq: 48000000

    clk_cross:
      kind: clk
      source: inv_mux
      freq: 24000000

    clk_pad:
      kind: clk
      source: mux_idle
      freq: 24000000

    src_27m:
      kind: source
      source_kind: source
      freq: 27000000

    src_dto_in:
      kind: source
      source_kind: source
      freq: 12000

    src_dto_n_in:
      kind: source
      source_kind: source
      freq: 8000

    src_1188m:
      kind: source
      source_kind: source
      freq: 1188000000

    div_1188:
      kind: div
      div_kind: div
      source: src_1188m
      regs:
        rst: blk_div_1188.ctrl.rst
        load: blk_div_1188.ctrl.load
        div: blk_div_1188.ctrl.div

    mux_clk:
      kind: mux
      source:
        "0": src_27m
        "1": div_1188
      reg: blk_mux_clk.sel.sel

    div_r2:
      kind: div
      div_kind: div_r
      source: mux_clk
      ratio: 2

    clk_13m5:
      kind: clk
      source: div_r2
      freq: 13500000

    src_stress_ref:
      kind: source
      source_kind: source
      freq: 25000000

    mux_stress_ref:
      kind: mux
      source:
        "0": xtal
        "1": src_stress_ref
        "2": pad_xtal
      reg: blk_mux_stress_ref.sel.sel

    dto_stress_ref:
      kind: div
      div_kind: dto
      source: mux_stress_ref
      regs:
        rst: blk_dto_stress_ref.ctrl.rst
        load: blk_dto_stress_ref.ctrl.load
        bypass: blk_dto_stress_ref.ctrl.bypass
        step: blk_dto_stress_ref.ctrl.step

    div_stress_ref:
      kind: div
      div_kind: div
      source: dto_stress_ref
      regs:
        rst: blk_div_stress_ref.ctrl.rst
        load: blk_div_stress_ref.ctrl.load
        div: blk_div_stress_ref.ctrl.div

    pll_stress_sc:
      kind: pll
      source: div_stress_ref
      pll_kind: sc
      freq: 50000000
      regs:
        lock: blk_pll_stress_sc.stat.lock
        vocpd: blk_pll_stress_sc.pd.vocpd
        postdivpd: blk_pll_stress_sc.pd.postdivpd
        dsmpd: blk_pll_stress_sc.pd.dsmpd
        pd: blk_pll_stress_sc.pd.pd
        bypass: blk_pll_stress_sc.pd.bypass
        refdiv: blk_pll_stress_sc.div.refdiv
        postdiv2: blk_pll_stress_sc.div.postdiv2
        postdiv1: blk_pll_stress_sc.div.postdiv1
        fbdiv: blk_pll_stress_sc.div.fbdiv

    div_stress_pll:
      kind: div
      div_kind: div
      source: pll_stress_sc
      regs:
        rst: blk_div_stress_pll.ctrl.rst
        load: blk_div_stress_pll.ctrl.load
        div: blk_div_stress_pll.ctrl.div

    clk_stress_pll:
      kind: clk
      source: div_stress_pll
      freq: 25000000

    src_dto_n_stress:
      kind: source
      source_kind: source
      freq: 12000

    mux_stress_dto_n:
      kind: mux
      source:
        "0": src_dto_n_stress
        "1": src_dto_in
      reg: blk_mux_stress_dto_n.sel.sel

    dto_n_stress_ref:
      kind: div
      div_kind: dto_n
      source: mux_stress_dto_n
      regs:
        rst: blk_dto_n_stress_ref.ctrl.rst
        load: blk_dto_n_stress_ref.ctrl.load
        bypass: blk_dto_n_stress_ref.ctrl.bypass
        step: blk_dto_n_stress_ref.ctrl.step

    pll_stress_tci:
      kind: pll
      source: dto_n_stress_ref
      pll_kind: tci
      freq: 48000
      regs:
        lock: blk_pll_stress_tci.lock.lock
        bypass: blk_pll_stress_tci.bypass.bypass
        pwrdn: blk_pll_stress_tci.pwrdn.pwrdn
        reset: blk_pll_stress_tci.reset.reset
        clkod: blk_pll_stress_tci.clkod.clkod
        clkf: blk_pll_stress_tci.clkf.clkf
        clkr: blk_pll_stress_tci.clkr.clkr
        bwadj: blk_pll_stress_tci.bwadj.bwadj

    clk_stress_dto_n:
      kind: clk
      source: pll_stress_tci
      freq: 48000

    src_stress_inno:
      kind: source
      source_kind: source
      freq: 24000000

    mux_stress_inno_ref:
      kind: mux
      source:
        "0": src_stress_inno
        "1": xtal
        "2": pad_xtal
        "3": src_stress_ref
      reg: blk_mux_stress_inno_ref.sel.sel

    dto_stress_inno:
      kind: div
      div_kind: dto
      source: mux_stress_inno_ref
      regs:
        rst: blk_dto_stress_inno.ctrl.rst
        load: blk_dto_stress_inno.ctrl.load
        bypass: blk_dto_stress_inno.ctrl.bypass
        step: blk_dto_stress_inno.ctrl.step

    pll_stress_inno:
      kind: pll
      source: dto_stress_inno
      pll_kind: inno
      regs:
        lock: blk_pll_stress_inno.lock.lock
        pd: blk_pll_stress_inno.pd.pd
        refdiv: blk_pll_stress_inno.refdiv.refdiv
        fbdiv: blk_pll_stress_inno.fbdiv.fbdiv
        postdiv1[0]: blk_pll_stress_inno.postdiv1_0.postdiv1_0
        postdiv2[0]: blk_pll_stress_inno.postdiv2_0.postdiv2_0
        postdiv1[1]: blk_pll_stress_inno.postdiv1_1.postdiv1_1
        postdiv2[1]: blk_pll_stress_inno.postdiv2_1.postdiv2_1

    mux_stress_inno_a:
      kind: mux
      source:
        "0": pll_stress_inno[0]
        "1": pll_stress_inno[1]
      reg: blk_mux_stress_inno_a.sel.sel

    mux_stress_inno_b:
      kind: mux
      source:
        "0": pll_stress_inno[0]
        "1": pll_stress_inno[1]
      reg: blk_mux_stress_inno_b.sel.sel

    cell_stress_inno_a:
      kind: cell
      cell_kind: buf
      source: mux_stress_inno_a

    gate_stress_inno_a:
      kind: gate
      source: cell_stress_inno_a
      reg: blk_gate_stress_inno_a.en.en

    cell_stress_inno_b:
      kind: cell
      cell_kind: buf
      source: mux_stress_inno_b

    gate_stress_inno_b:
      kind: gate
      source: cell_stress_inno_b
      reg: blk_gate_stress_inno_b.en.en

    clk_stress_inno_a:
      kind: clk
      source: gate_stress_inno_a
      freq: 48000000

    clk_stress_inno_b:
      kind: clk
      source: gate_stress_inno_b
      freq: 24000000

    src_ms0:
      kind: source
      source_kind: source
      freq: 24000000

    src_ms1:
      kind: source
      source_kind: source
      freq: 24000000

    src_ms2:
      kind: source
      source_kind: source
      freq: 24000000

    src_ms3:
      kind: source
      source_kind: source
      freq: 24000000

    mux_ms0:
      kind: mux
      source:
        "0": src_ms0
        "1": src_ms1
        "2": src_ms2
        "3": src_ms3
      reg: blk_mux_ms0.sel.sel

    mux_ms1:
      kind: mux
      source:
        "0": mux_ms0
        "1": src_ms0
        "2": src_ms1
        "3": src_ms2
      reg: blk_mux_ms1.sel.sel

    mux_ms2:
      kind: mux
      source:
        "0": mux_ms1
        "1": src_ms3
        "2": src_ms0
      reg: blk_mux_ms2.sel.sel

    mux_ms3:
      kind: mux
      source:
        "0": mux_ms2
        "1": src_ms1
        "2": src_ms2
        "3": src_ms3
      reg: blk_mux_ms3.sel.sel

    div_ms:
      kind: div
      div_kind: div
      source: mux_ms3
      regs:
        rst: blk_div_ms.ctrl.rst
        load: blk_div_ms.ctrl.load
        div: blk_div_ms.ctrl.div

    clk_ms_a:
      kind: clk
      source: div_ms
      freq: 24000000

    clk_ms_b:
      kind: clk
      source: div_ms
      freq: 24000000

    src_deep:
      kind: source
      source_kind: source
      freq: 96000000

    gate_deep:
      kind: gate
      source: src_deep
      reg: blk_gate_deep.en.en

    div_deep_a:
      kind: div
      div_kind: div
      source: gate_deep
      regs:
        rst: blk_div_deep_a.ctrl.rst
        load: blk_div_deep_a.ctrl.load
        div: blk_div_deep_a.ctrl.div

    div_deep_b:
      kind: div
      div_kind: div
      source: gate_deep
      regs:
        rst: blk_div_deep_b.ctrl.rst
        load: blk_div_deep_b.ctrl.load
        div: blk_div_deep_b.ctrl.div

    div_deep_c:
      kind: div
      div_kind: div
      source: gate_deep
      regs:
        rst: blk_div_deep_c.ctrl.rst
        load: blk_div_deep_c.ctrl.load
        div: blk_div_deep_c.ctrl.div

    div_deep_d:
      kind: div
      div_kind: div
      source: gate_deep
      regs:
        rst: blk_div_deep_d.ctrl.rst
        load: blk_div_deep_d.ctrl.load
        div: blk_div_deep_d.ctrl.div

    div_deep_e:
      kind: div
      div_kind: div
      source: gate_deep
      regs:
        rst: blk_div_deep_e.ctrl.rst
        load: blk_div_deep_e.ctrl.load
        div: blk_div_deep_e.ctrl.div

    div_deep_f:
      kind: div
      div_kind: div
      source: gate_deep
      regs:
        rst: blk_div_deep_f.ctrl.rst
        load: blk_div_deep_f.ctrl.load
        div: blk_div_deep_f.ctrl.div

    clk_deep_a:
      kind: clk
      source: div_deep_a
      freq: 48000000

    clk_deep_b:
      kind: clk
      source: div_deep_b
      freq: 32000000

    clk_deep_c:
      kind: clk
      source: div_deep_c
      freq: 24000000

    clk_deep_d:
      kind: clk
      source: div_deep_d
      freq: 19200000

    clk_deep_e:
      kind: clk
      source: div_deep_e
      freq: 16000000

    clk_deep_f:
      kind: clk
      source: div_deep_f
      freq: 12000000

    div_share:
      kind: div
      div_kind: div
      source: pll_sc
      regs:
        rst: blk_div_share.ctrl.rst
        load: blk_div_share.ctrl.load
        div: blk_div_share.ctrl.div

    clk_share_a:
      kind: clk
      source: div_share
      freq: 30000000

    clk_share_b:
      kind: clk
      source: div_share
      freq: 30000000

    clk_share_c:
      kind: clk
      source: div_share
      freq: 30000000

settings:
  main_fn: chip_pll_config
  gate_reg_high_means_open: true
  solve_timeout_ms: 180000
