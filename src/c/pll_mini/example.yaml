# pll_mini 示范：单路 PLL SC + div + mux + gate

regmodel:
  - path: blk_pll_sc.pd
    address: 0x00000100
    fields:
      - name: vocpd
        lsb: 0
        width: 1
      - name: postdivpd
        lsb: 1
        width: 1
      - name: dsmpd
        lsb: 2
        width: 1
      - name: pd
        lsb: 3
        width: 1
      - name: bypass
        lsb: 4
        width: 1
  - path: blk_pll_sc.div
    address: 0x00000104
    fields:
      - name: refdiv
        lsb: 0
        width: 6
      - name: postdiv2
        lsb: 8
        width: 3
      - name: postdiv1
        lsb: 12
        width: 3
      - name: fbdiv
        lsb: 16
        width: 12
  - path: blk_pll_sc.stat
    address: 0x00000108
    fields:
      - name: lock
        lsb: 0
        width: 1
  - path: blk_div0.ctrl
    address: 0x00000200
    fields:
      - name: rst
        lsb: 0
        width: 1
      - name: load
        lsb: 1
        width: 1
      - name: div
        lsb: 8
        width: 8
  - path: blk_mux_ref.sel
    address: 0x00000300
    fields:
      - name: sel
        lsb: 0
        width: 2
  - path: blk_gate0.en
    address: 0x00000400
    fields:
      - name: en
        lsb: 0
        width: 1

tree:
  name: main
  nodes:
    xtal:
      kind: source

    pll_sc:
      kind: pll
      source: xtal
      pll_kind: sc
      regs:
        lock: blk_pll_sc.stat.lock
        vocpd: blk_pll_sc.pd.vocpd
        postdivpd: blk_pll_sc.pd.postdivpd
        dsmpd: blk_pll_sc.pd.dsmpd
        pd: blk_pll_sc.pd.pd
        bypass: blk_pll_sc.pd.bypass
        refdiv: blk_pll_sc.div.refdiv
        postdiv2: blk_pll_sc.div.postdiv2
        postdiv1: blk_pll_sc.div.postdiv1
        fbdiv: blk_pll_sc.div.fbdiv
      cfg:
        lock: 0
        vocpd: 0
        postdivpd: 0
        dsmpd: 0
        pd: 0
        bypass: 0
        refdiv: 1
        postdiv2: 1
        postdiv1: 1
        fbdiv: 40

    div0:
      kind: div
      source: pll_sc
      regs:
        rst: blk_div0.ctrl.rst
        load: blk_div0.ctrl.load
        div: blk_div0.ctrl.div
      cfg:
        div: 2

    mux_ref:
      kind: mux
      source:
        "0": pll_sc
        "1": xtal
      reg: blk_mux_ref.sel.sel
      sel: 0

    gate0:
      kind: gate
      source: mux_ref
      reg: blk_gate0.en.en
      open: true

settings:
  main_fn: chip_pll_config
  gate_reg_high_means_open: true
