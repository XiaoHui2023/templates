# 提交前健全检查第 2 步：晶振→sc PLL→cpu_gate 三路；hclk 经 gate 到 clk；mbist 支路 open=0。
# 与 normal.yaml 一并由 example\check.bat 跑通后再提交。

ralf: example/normal.ralf

tree:
  name: cpu_gate_branch
  nodes:
    xin:
      kind: source
      source_kind: source
      freq: 27000000

    cpu_pll:
      kind: pll
      source: xin
      pll_kind: sc
      freq: 729000000
      regs:
        lock: blk_pll_sc.stat.lock
        vocpd: blk_pll_sc.pd.vocpd
        postdivpd: blk_pll_sc.pd.postdivpd
        dsmpd: blk_pll_sc.pd.dsmpd
        pd: blk_pll_sc.pd.pd
        bypass: blk_pll_sc.pd.bypass
        refdiv: blk_pll_sc.div.refdiv
        postdiv2: blk_pll_sc.div.postdiv2
        postdiv1: blk_pll_sc.div.postdiv1
        fbdiv: blk_pll_sc.div.fbdiv

    cpu_axi_clk_div:
      kind: div
      div_kind: cpu_gate
      source: cpu_pll
      regs:
        rst: blk_cpu_gate0.ctrl.rst
        div: blk_cpu_gate0.ctrl.div

    cpu_axi_clk_gate2:
      kind: gate
      source: cpu_axi_clk_div[hclk]

    cpu_axi_clk:
      kind: clk
      source: cpu_axi_clk_gate2
      freq: 365000000

    cpu_axi_clken:
      kind: clk
      source: cpu_axi_clk_div[hclk_en]

    ca7_mbist_mode:
      kind: gate
      source: cpu_axi_clk_div[clk_arm_core]
      open: 0

    o_ca7_mbist_clk:
      kind: clk
      source: ca7_mbist_mode

settings:
  main_fn: chip_pll_config
  solve_timeout_ms: 30000
