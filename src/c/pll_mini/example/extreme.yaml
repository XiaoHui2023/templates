      "0": div0
      "1": xtal
    reg: blk_mux_ref.sel.sel

  mux_inno:
    kind: mux
    source:
      "0": pll_inno[0]
      "1": pll_inno[1]
    reg: blk_mux_inno.sel.sel

  gate0:
    kind: gate
    source: mux_ref
    reg: blk_gate0.en.en

  gate_dw:
    kind: gate
