# 寄存器异常：YAML 引用了超出 field 位宽的切片。
# blk_div0.ctrl.div 在 normal.ralf 中为 8 bit，这里故意取 [9:0]。
# 期望失败阶段：config_plan。

ralf: example/normal.ralf

nodes:
  xtal:
    kind: source
    source_kind: source
    freq: 24000000

  div_bad_slice:
    kind: div
    div_kind: div
    source: xtal
    regs:
      rst: blk_div0.ctrl.rst
      load: blk_div0.ctrl.load
      div: blk_div0.ctrl.div[9:0]

  clk_out:
    kind: clk
    source: div_bad_slice
    freq: 12000000

settings:
  main_fn: chip_pll_config_reg_bit_range
